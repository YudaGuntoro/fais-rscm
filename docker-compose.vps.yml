name: rscm-fais

services:
  api:
    build:
      context: ./Backend
      dockerfile: Web.API/Dockerfile
    image: rscm-fais-api:latest
    container_name: rscm-fais-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${MYSQL_CONNECTION_STRING}
      Jwt__Issuer: ${JWT_ISSUER:-RSCMFAIS}
      Jwt__Audience: ${JWT_AUDIENCE:-RSCMFAIS.Frontend}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__ExpiresHours: ${JWT_EXPIRES_HOURS:-8}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      Cors__AllowedOrigins__1: ${FRONTEND_ORIGIN_ALT:-http://127.0.0.1:8091}
    ports:
      - "${API_HOST_PORT:-5274}:8080"
    networks:
      - rscm-fais-net

  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://api:8080}
    image: rscm-fais-web:latest
    container_name: rscm-fais-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://api:8080}
    ports:
      - "${FRONTEND_HOST_PORT:-8091}:3000"
    networks:
      - rscm-fais-net

  worker:
    profiles:
      - worker
    build:
      context: ./Backend/Worker
      dockerfile: Dockerfile
    image: rscm-fais-worker:latest
    container_name: rscm-fais-worker
    restart: unless-stopped
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MQTT_HOST: ${MQTT_HOST:-host.docker.internal}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-Worker}
      MQTT_TOPIC: ${MQTT_TOPIC:-fais_mqtt}
      MQTT_QOS: ${MQTT_QOS:-2}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-1}
      WORKER_RECONNECT_DELAY_SECONDS: ${WORKER_RECONNECT_DELAY_SECONDS:-3}
      WORKER_DOWNTIME_DATABASE_FALLBACK_MINUTES: ${WORKER_DOWNTIME_DATABASE_FALLBACK_MINUTES:-10}
      MAIN_SERVER_UPLOAD_URL: ${MAIN_SERVER_UPLOAD_URL:-}
      MAIN_SERVER_TIMEOUT_SECONDS: ${MAIN_SERVER_TIMEOUT_SECONDS:-5}
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING:-redis:6379}
      REDIS_BUFFER_KEY: ${REDIS_BUFFER_KEY:-fais:mqtt:buffer}
    volumes:
      - ./Backend/Worker/Settings.ini:/app/Settings.ini:ro
      - rscm-fais-worker-buffer:/app/buffer
    networks:
      - rscm-fais-net

  redis:
    image: redis:7-alpine
    container_name: rscm-fais-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - rscm-fais-redis-data:/data
    networks:
      - rscm-fais-net

networks:
  rscm-fais-net:
    driver: bridge

volumes:
  rscm-fais-worker-buffer:
  rscm-fais-redis-data:
